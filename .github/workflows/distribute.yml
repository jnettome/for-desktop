name: Distribute

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  make:
    name: Make (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            make_targets: "@electron-forge/maker-zip,@electron-forge/maker-deb"
          - os: windows-latest
            name: windows
            make_targets: "@electron-forge/maker-squirrel,@electron-forge/maker-zip"
          - os: macos-latest
            name: macos
            make_targets: "@electron-forge/maker-zip"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout assets
        run: git -c submodule."assets".update=checkout submodule update --init assets

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Make distributables
        run: pnpm run make -- --targets=${{ matrix.make_targets }}
        env:
          PLATFORM: ${{ matrix.os }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stoat-desktop-${{ matrix.name }}
          path: out/make
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: make
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v1.5.2-selfhosted
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.exe' \))
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No distributable files found"
            find artifacts -type f
            exit 1
          fi

          notes="$(cat <<'EOF'
          Unsigned builds of Stoat Desktop with self-hosted instance setup.

          On first launch, choose official Stoat or enter your instance URL.
          Later: tray menu → Change instance…

          macOS: right-click → Open the first time (unsigned).
          Windows: SmartScreen may warn because this is not code-signed.
          EOF
          )"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "${files[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --prerelease \
              --title "Stoat Desktop 1.5.2 (self-hosted)" \
              --notes "$notes"
          fi
